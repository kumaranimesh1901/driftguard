services:
  postgres:
    image: postgres:15
    environment: { POSTGRES_USER: driftguard, POSTGRES_PASSWORD: driftguard, POSTGRES_DB: driftguard }
    ports: ["5432:5432"]
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "pg_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U driftguard"], interval: 5s, timeout: 5s, retries: 10 }
  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    volumes: ["./db/mongo_init.js:/docker-entrypoint-initdb.d/mongo_init.js:ro", "mongo_data:/data/db"]
    healthcheck: { test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    depends_on: { postgres: { condition: service_healthy }, mongo: { condition: service_healthy } }
    volumes: [".:/app"]
  frontend:
    build: .
    command: streamlit run frontend/Home.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    depends_on: [api]
    volumes: [".:/app"]
volumes: { pg_data: {}, mongo_data: {} }
